<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());gtag('config','G-JDF6C87JWF');
/* recruiter-relevant events: résumé opens, contact sends, prototype/external clicks, case-study opens */
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a');if(!a)return;var h=a.getAttribute('href')||'';
  if(/resume\.pdf$/i.test(h))gtag('event','resume_open',{link_url:h,page:location.pathname});
  else if(/^mailto:/i.test(h))gtag('event','email_click',{page:location.pathname});
  else if(/^tel:/i.test(h))gtag('event','phone_click',{page:location.pathname});
  else if(/xd\.adobe\.com|figma\.com|github\.io/i.test(h))gtag('event','prototype_open',{link_url:h,link_text:(a.innerText||'').trim(),page:location.pathname});
  else if(/^[a-z0-9-]+\.html(#.*)?$/i.test(h)&&!/^(index|contact)\.html/i.test(h))gtag('event','case_study_open',{project:h.replace(/\.html.*$/,''),from:location.pathname});
},true);
document.addEventListener('submit',function(e){if(e.target&&e.target.id==='cform')gtag('event','contact_form_submit',{page:location.pathname});},true);
</script>
<style>
.cpage{position:relative;min-height:100vh;background:var(--mist);overflow:hidden;padding:150px 0 100px}
.cpage .aura{z-index:0}
.cgrid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(32px,6vw,96px);align-items:start}
.cpage h1{font-weight:600;font-size:clamp(46px,6vw,84px);line-height:1.02;letter-spacing:-.02em}
.cpage .intro{font-size:clamp(18px,1.5vw,21px);color:var(--muted);margin:22px 0 40px;max-width:36ch}
.ways{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.ways a{display:flex;gap:16px;align-items:center;text-decoration:none;background:#fff;border-radius:18px;padding:16px 20px;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.ways a:hover{transform:translateX(4px)}
.ways .ci{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:14px;background:var(--blue);color:#fff}
.ways .ci svg{width:22px;height:22px}
.ways b{display:block;font:600 12px var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--blue-text)}
.ways span.v{font:500 17px var(--head);color:var(--navy)}
.cform{background:#fff;border-radius:28px;padding:clamp(26px,3.5vw,48px)}
.cform h2{font-size:clamp(24px,2.2vw,32px);font-weight:600;margin-bottom:24px}
.field{display:grid;gap:8px;margin-bottom:20px}
.field label{font:600 14px var(--head);color:var(--navy)}
.field label i{font-style:normal;color:var(--blue-text)}
.field input,.field textarea{font:400 16px var(--body);color:var(--ink);background:var(--mist);border:2px solid transparent;border-radius:12px;padding:14px 16px;width:100%;transition:border-color .2s,background .2s}
.field textarea{min-height:170px;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);background:#fff}
.field [aria-invalid=true]{border-color:#C2341C}
.err{font-size:13.5px;color:#C2341C;min-height:0}
.cform .btn{cursor:pointer;font-size:16px}
.note{margin:16px 0 0;font-size:14.5px;color:var(--muted)}
.note.ok{color:#166A43}
.note.bad{color:#C2341C}
.note:empty{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.cform .btn[disabled]{opacity:.6;cursor:progress}
@media (max-width:900px){.cgrid{grid-template-columns:1fr}.cpage{padding-top:120px}}
</style>

<script>
(function(){
  var f=document.getElementById('cform'),note=document.getElementById('f-note');
  function check(el,msg){var bad=!el.value.trim()||(el.type==='email'&&!/^\S+@\S+\.\S+$/.test(el.value.trim()));
    el.setAttribute('aria-invalid',bad);document.getElementById(el.getAttribute('aria-describedby')).textContent=bad?msg:'';return !bad;}
  f.addEventListener('submit',function(e){e.preventDefault();
    var n=f.elements.name,m=f.elements.email,t=f.elements.message;
    var ok=[check(n,'Please enter your name.'),check(m,'Please enter a valid email address.'),check(t,'Please enter a message.')];
    if(ok.indexOf(false)>-1){f.querySelector('[aria-invalid=true]').focus();return;}
    var btn=f.querySelector('button[type=submit]');
    if(f.elements.botcheck.checked)return;
    btn.disabled=true;btn.textContent='Sending…';note.className='note';note.textContent='';
    fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({access_key:'215dc960-900b-43cb-8003-c7a5a695b106',subject:'Portfolio inquiry from '+n.value.trim(),from_name:'joshua-russell.com',
        name:n.value.trim(),email:m.value.trim(),replyto:m.value.trim(),message:t.value.trim(),botcheck:false})})
    .then(function(r){return r.json();})
    .then(function(d){if(!d.success)throw new Error(d.message||'failed');
      f.reset();note.className='note ok';note.textContent='Thanks! Your message is on its way. I’ll be in touch soon.';
      if(window.gtag)gtag('event','contact_form_sent',{page:location.pathname});})
    .catch(function(){note.className='note bad';note.textContent='Sorry, something went wrong sending your message. Please email me directly at jc_russell@live.com.';})
    .finally(function(){btn.disabled=false;btn.textContent='Send message';});
  });
})();
</script>
